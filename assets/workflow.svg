<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MATLAB CST Simulation Skill workflow</title>
  <desc id="desc">A workflow from paper input, target selection, parameter extraction, modeling plan, MATLAB automation, CST model generation, solver confirmation, and result export.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 44px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 24px Arial, Helvetica, sans-serif; fill: #4f5f76; }
      .box-title { font: 700 25px Arial, Helvetica, sans-serif; fill: #172033; }
      .box-text { font: 400 19px Arial, Helvetica, sans-serif; fill: #435168; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .note { font: 400 18px Arial, Helvetica, sans-serif; fill: #5c6b80; }
      .box { stroke-width: 2.5; rx: 20; ry: 20; }
      .arrow { fill: none; stroke: #435168; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft { opacity: 0.96; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#435168"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b2a42" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="88" y="82" class="title">MATLAB CST Simulation Skill</text>
  <text x="90" y="124" class="subtitle">Paper-to-model workflow for agent-assisted CST reproduction</text>

  <rect x="88" y="164" width="1424" height="620" rx="32" fill="#ffffff" stroke="#dce4ef" stroke-width="2" filter="url(#shadow)"/>

  <g class="soft">
    <rect class="box" x="132" y="238" width="250" height="136" fill="#eaf4ff" stroke="#70a8e5"/>
    <text x="156" y="283" class="box-title">Paper or supplement</text>
    <text x="156" y="319" class="box-text">Read figures, captions,</text>
    <text x="156" y="347" class="box-text">tables, equations, notes</text>

    <rect class="box" x="468" y="238" width="250" height="136" fill="#fff4df" stroke="#dfa742"/>
    <text x="492" y="283" class="box-title">Ask target first</text>
    <text x="492" y="319" class="box-text">Which figure, table,</text>
    <text x="492" y="347" class="box-text">model, or result?</text>

    <rect class="box" x="804" y="238" width="250" height="136" fill="#e9f8ef" stroke="#66b982"/>
    <text x="828" y="283" class="box-title">Extract parameters</text>
    <text x="828" y="319" class="box-text">Geometry, materials,</text>
    <text x="828" y="347" class="box-text">solver, ports, monitors</text>

    <rect class="box" x="1140" y="238" width="250" height="136" fill="#f0ecff" stroke="#8e77d8"/>
    <text x="1164" y="283" class="box-title">Modeling plan</text>
    <text x="1164" y="319" class="box-text">Trace sources, assumptions,</text>
    <text x="1164" y="347" class="box-text">missing values, steps</text>

    <rect class="box" x="300" y="496" width="250" height="136" fill="#eef7f7" stroke="#5bb3b0"/>
    <text x="324" y="541" class="box-title">MATLAB automation</text>
    <text x="324" y="577" class="box-text">Version probe, COM,</text>
    <text x="324" y="605" class="box-text">CST VBA history</text>

    <rect class="box" x="636" y="496" width="250" height="136" fill="#fff0ee" stroke="#d67868"/>
    <text x="660" y="541" class="box-title">CST model built</text>
    <text x="660" y="577" class="box-text">Units, boundaries,</text>
    <text x="660" y="605" class="box-text">geometry, setup saved</text>

    <rect class="box" x="972" y="496" width="250" height="136" fill="#f6f0e8" stroke="#b58a54"/>
    <text x="996" y="541" class="box-title">Ask before solver</text>
    <text x="996" y="577" class="box-text">Run now only after</text>
    <text x="996" y="605" class="box-text">explicit approval</text>

    <rect class="box" x="1308" y="496" width="160" height="136" fill="#edf2ff" stroke="#6d86ce"/>
    <text x="1330" y="541" class="box-title">Results</text>
    <text x="1330" y="577" class="box-text">Logs, fields,</text>
    <text x="1330" y="605" class="box-text">S-params</text>
  </g>

  <path class="arrow" d="M382 306 H456"/>
  <path class="arrow" d="M718 306 H792"/>
  <path class="arrow" d="M1054 306 H1128"/>
  <path class="arrow" d="M1265 374 C1265 438 425 428 425 484"/>
  <path class="arrow" d="M550 564 H624"/>
  <path class="arrow" d="M886 564 H960"/>
  <path class="arrow" d="M1222 564 H1296"/>

  <rect x="110" y="700" width="1380" height="44" rx="22" fill="#172033"/>
  <text x="145" y="729" class="label">Key safety checkpoints:</text>
  <text x="364" y="729" class="label">target selection before extraction</text>
  <circle cx="682" cy="722" r="5" fill="#ffffff"/>
  <text x="704" y="729" class="label">missing critical values before build</text>
  <circle cx="1038" cy="722" r="5" fill="#ffffff"/>
  <text x="1060" y="729" class="label">user confirmation before solver launch</text>

  <text x="90" y="835" class="note">Designed for repeatable MATLAB scripts that drive CST Studio Suite through Windows COM/ActiveX and durable VBA history commands.</text>
</svg>
